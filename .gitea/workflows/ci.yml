name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The same gate `just check` and the release run: typecheck + tests + pack + nu tests.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.111.0"

      - run: bun install --frozen-lockfile

      - name: Quality gate (coverage thresholds are enforced by bunfig.toml)
        run: nu scripts/ci/quality_gate.nu

      - name: Coverage summary
        if: always()
        run: nu scripts/ci/coverage_summary.nu

  # Day/week/month bucketing is local-time: exercise the extremes.
  timezones:
    name: test (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [Pacific/Auckland, Pacific/Pago_Pago, America/Los_Angeles]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: bun test
        run: bun test
        env:
          TZ: ${{ matrix.tz }}
